version: 2
updates:
  # Check GitHub Actions versions weekly
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Check Frontend npm dependencies weekly
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"

  # Check Backend npm dependencies weekly
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"